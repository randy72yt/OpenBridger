# Build web/dist with `cd web && bun install --frozen-lockfile && bun run build`
# before building this image. TLS terminates at the host reverse proxy.
# All secrets are supplied by the deployment environment; this file stores none.
services:
  openbridger:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: openbridger:${OPENBRIDGER_IMAGE_TAG:?Set an immutable release tag}
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - openbridger_data:/data
    environment:
      SQL_DSN: ${SQL_DSN:?Set the production database DSN}
      REDIS_CONN_STRING: ${REDIS_CONN_STRING:?Set the production Redis DSN}
      SESSION_SECRET: ${SESSION_SECRET:?Set a unique production session secret}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?Set a unique production crypto secret}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_TRUSTED_URL: https://openbridger.com
      FRONTEND_BASE_URL: https://openbridger.com
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?Set only the actual reverse proxy addresses}
      NODE_TYPE: master
      GIN_MODE: release
      # Every runtime switch below is supplied by /srv/openbridger/.env.
      # The fallbacks are the documented defaults; auto-publish defaults to
      # false because unattended price changes need an explicit opt-in (D1).
      PRICING_CONTROL_ENABLED: ${PRICING_CONTROL_ENABLED:-true}
      PRICING_AUTO_PUBLISH: ${PRICING_AUTO_PUBLISH:-false}
      PRICING_AUTO_PUBLISH_OPERATOR_ID: ${PRICING_AUTO_PUBLISH_OPERATOR_ID:-1}
      PRICING_OFFER_SYNC_INTERVAL_MINUTES: ${PRICING_OFFER_SYNC_INTERVAL_MINUTES:-60}
      PRICING_OFFER_TTL_MINUTES: ${PRICING_OFFER_TTL_MINUTES:-120}
      PRICING_RECALCULATE_INTERVAL_MINUTES: ${PRICING_RECALCULATE_INTERVAL_MINUTES:-60}
      PRICING_GROUP_RATIO_POLICY: ${PRICING_GROUP_RATIO_POLICY:-median}
      # Calibration reads the upstream consumption log and derives the real
      # cost factor per model, because the published group ratios turned out to
      # overprice some families by an order of magnitude.
      PRICING_CALIBRATION_ENABLED: ${PRICING_CALIBRATION_ENABLED:-true}
      PRICING_CALIBRATION_INTERVAL_MINUTES: ${PRICING_CALIBRATION_INTERVAL_MINUTES:-720}
      PRICING_CALIBRATION_WINDOW_HOURS: ${PRICING_CALIBRATION_WINDOW_HOURS:-72}
      PRICING_CALIBRATION_MIN_SAMPLES: ${PRICING_CALIBRATION_MIN_SAMPLES:-5}
      PRICING_CALIBRATION_MAX_DISPERSION_PCT: ${PRICING_CALIBRATION_MAX_DISPERSION_PCT:-15}
      PRICING_CALIBRATION_STALE_HOURS: ${PRICING_CALIBRATION_STALE_HOURS:-96}
      PRICING_CALIBRATION_LOG_PATH: ${PRICING_CALIBRATION_LOG_PATH:-/api/log/token}
      PRICING_CALIBRATION_RETENTION_DAYS: ${PRICING_CALIBRATION_RETENTION_DAYS:-30}
      CHANNEL_UPSTREAM_MODEL_UPDATE_TASK_ENABLED: ${CHANNEL_UPSTREAM_MODEL_UPDATE_TASK_ENABLED:-true}
      CHANNEL_UPSTREAM_MODEL_UPDATE_TASK_INTERVAL_MINUTES: ${CHANNEL_UPSTREAM_MODEL_UPDATE_TASK_INTERVAL_MINUTES:-30}
      OPENBRIDGER_ONLINE_PAYMENT_ENABLED: ${OPENBRIDGER_ONLINE_PAYMENT_ENABLED:-false}
      ERROR_LOG_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\":true'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  openbridger_data:
